[project]
name = "lm-detokenization"
version = "0.1.0"
description = "Add your description here"
authors = [
    {name = "gokamoda", email = "gokamoda@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9.2",
    "polars>=1.12.0",
    "rich>=13.9.4",
    "seaborn>=0.13.2",
    "torchtyping>=0.1.5",
    "transformers>=5.4.0",
    "feature-extractor",
    "corpus-tools[count]",
    "wordfreq>=3.1.1",
    "tiktoken>=0.8.0",
    "protobuf==3.20.3",
    "scipy>=1.14.1",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5.2",
    "sentencepiece>=0.2.0",
]

[project.scripts]
# data
sample-openwebtext = "lm_detokenization.cli.data:sample_openwebtext_cli"
count-frequency = "lm_detokenization.cli.data:count_frequency_cli"
attention-rows = "lm_detokenization.cli.data:attention_rows_main"
six-terms = "lm_detokenization.cli.six_terms:compute_main"
detok-auroc = "lm_detokenization.cli.detokenization:auroc_main"
# tables
detok-auroc-table = "lm_detokenization.cli.detokenization:auroc_table_main"
detok-top-prefixes = "lm_detokenization.cli.detokenization:top_prefixes_main"
# figures
tp-plot = "lm_detokenization.cli.position_terms_plot:tp_main"
tpp-plot = "lm_detokenization.cli.position_terms_plot:tpp_main"
tp-tpp-plot = "lm_detokenization.cli.position_terms_plot:tp_tpp_main"
undertrained-plot = "lm_detokenization.cli.position_terms_plot:undertrained_main"
vs-tptpp-plot = "lm_detokenization.cli.position_terms_plot:vs_tptpp_main"
position-bias-plot = "lm_detokenization.cli.position_terms_plot:position_bias_main"
tee-plot = "lm_detokenization.cli.token_terms_plot:tee_main"
te-plot = "lm_detokenization.cli.token_terms_plot:te_main"
variance-plot = "lm_detokenization.cli.token_terms_plot:variance_main"
six-terms-plot = "lm_detokenization.cli.six_terms:plot_main"
roc-plot = "lm_detokenization.cli.detokenization:roc_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_detokenization"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["src/lm_detokenization"]

[dependency-groups]
dev = [
    "ipython>=8.29.0",
    "jupyter>=1.1.1",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "pytest>=8.3.3",
    "ruff>=0.6.6",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[project.optional-dependencies]
cpu = ["torch==2.7.0"]
gpu = ["torch==2.7.0"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu-mac", extra = "cpu", marker = "platform_system == 'macOS'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'macOS'" },
  { index = "pytorch-gpu", extra = "gpu" },
]

feature-extractor = { git = "https://github.com/gokamoda/transformer-feature-extractor.git", rev = "325eb06" }
corpus-tools = { git = "https://github.com/gokamoda/corpus-tools.git", rev = "7de5200" }
hfdecoderutils = { git = "https://github.com/gokamoda/lm_generation_cheatsheet.git", rev = "23796e8" }

[[tool.uv.index]]
name = "pytorch-cpu-mac"
url = "https://pypi.python.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "third_party"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL",  # Pylint
    "UP",  # pyupgrade
]
ignore = [
    "B905",  # Zip-without-explicit-strict
    "E501",  # Line too long, handled by black
    "F401",  # module imported but unused
    "F403",  # Unable to detect undefined names
    "N812",  # Lowercase imported as non-lowercase
    "N999",  # Invalid module name
    "UP035",  # Checks for uses of deprecated imports based on the minimum supported Python version.
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0915",  # Too many statements in function
    "PLR2004",  # Magic value used in comparison
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true  # Settings for Python 3.8 compatibility

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.mypy]
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
